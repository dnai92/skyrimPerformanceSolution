<!doctype html>
<html><head><meta charset="utf-8"><title>SPS Divider</title>
<style>
  html, body { margin: 0; width: 1000px; height: 60px; background: transparent; }
</style></head>
<body>
<svg width="1000" height="60" viewBox="0 0 1000 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="l" x1="0" x2="1">
      <stop offset="0" stop-color="#3d9bff" stop-opacity="0"/>
      <stop offset="1" stop-color="#3d9bff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="r" x1="0" x2="1">
      <stop offset="0" stop-color="#3d9bff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3d9bff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="80" y="35" width="370" height="2" fill="url(#l)"/>
  <rect x="550" y="35" width="370" height="2" fill="url(#r)"/>
  <!-- gauge -->
  <g transform="translate(500 44)">
    <path d="M -30 0 A 30 30 0 0 1 30 0" fill="none" stroke="#e8edf3" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#e8edf3" stroke-width="3" stroke-linecap="round">
      <line x1="-21" y1="-1" x2="-16" y2="-1"/>
      <line x1="-15" y1="-15" x2="-11.5" y2="-11.5"/>
      <line x1="0" y1="-21" x2="0" y2="-16"/>
    </g>
    <line x1="0" y1="0" x2="15" y2="-17" stroke="#3d9bff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#3d9bff"/>
  </g>
</svg>
</body></html>
