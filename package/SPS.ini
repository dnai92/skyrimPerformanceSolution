; Skyrim Performance Solution (SPS) - default settings
; Changes are also applied while the game is running (after about 2 seconds, see SPS.log).
; Settings changed in the in-game menu are saved to SPS_User.ini and override the values below.
; Distances are in game units: ~70 units = 1 m.

[General]
; Key that toggles ALL optimizations in game (DirectInput scan code, decimal).
; 199 = Home, 207 = End, 201 = Page Up, 209 = Page Down, 210 = Insert. A message appears top left when toggling.
iToggleKey = 201
; Analysis logging (detailed diagnostics in SPS.log, costs main thread time). SE/AE: switched on in the menu only
; (Overview > Settings), always starts OFF with the game - this line is ignored. VR (no menu): set to true here.
bAnalysis = false
; Developer option, read at game start only: measures wait times of HDT-SMP/CBPC and engine timings by redirecting
; their wait functions through SPS. Leave off for normal play.
bEngineProbes = false

[ShadowCulling]
; Small, far away objects no longer cast sun shadows (saves draw calls).
; An object is only culled when ALL conditions below are met.
; Depends on the sun elevation: instead of the radius, the approximate shadow length (radius / sin(sun elevation)) counts.
; With low morning/evening sun far fewer shadows are culled (otherwise lighting errors in the distance).
bEnabled = true

; Below this sun elevation (degrees) no sun shadows are culled at all. Above it the rule already counts the longer
; shadow of a low sun (radius / sin(elevation)). 1.0.17: 25 -> 10, at 14-17 deg no missing shadows, sun shadow CPU -2..4 ms.
; 0 = always cull.
fMinSunElevation = 10

; Only cull from this shadow cascade on (0 = nearest cascade, 1 = from the second one).
iMinCascade = 1

; Minimum distance to the camera. Closer -> always a shadow.
fMinDistance = 1500

; Objects with a larger radius (buildings, walls, rocks) always cast shadows.
; 150 (~2 m): with 250 the shadows of gate parts, bridges and towers disappeared at 70-150 m.
fMaxRadius = 150

; Radius divided by distance: below this value the object looks so small that its shadow is dropped.
; 0.035 = e.g. a barrel (radius ~40) from ~1500 units, a bush (radius ~80) from ~2300, a cart (radius ~200) from ~5700.
; In testing (Whiterun market) no visual difference to 0.02, but ~30 % fewer meshes in cascade 1.
; Higher = more culling, lower = less culling.
fMinAngularSize = 0.035

; Never cull characters and creatures (skinned meshes).
bSkipSkinned = true

[PointLightShadowCulling]
; Like [ShadowCulling], but for shadows of torches, lanterns, fires etc. (point and spot lights).
; Objects close to the light always keep their shadow.
bEnabled = true
fMinDistance = 1000
fMaxRadius = 150
fMinAngularSize = 0.035
bSkipSkinned = true
; Also in interiors? Interiors are lit almost only by point lights, so missing shadows are noticeable there.
bInteriors = false

[LightShadowCache]
; Keep the shadow maps of lights that do not move (wall lamps, fireplaces) and only redraw characters, things
; attached to them, effects and objects that were seen moving. Flickering (moving) lights are always redrawn.
; Mainly helps in interiors with many lights. Anniversary Edition only.
bEnabled = true

[SkylightingCulling]
; Community Shaders skylighting: coarse occlusion map seen from above (512x512). CS includes objects from radius 32.
; Objects smaller than fMinRadius are additionally left out.
bEnabled = true
fMinRadius = 128

[DepthPrepassCulling]
; Depth pre-pass of the main scene: small, far objects are NOT drawn into the depth buffer in advance
; (the main pass still draws them normally). Side effect: such objects get the sun shadow value of the background.
; OFF BY DEFAULT: in testing, whole objects (not only small ones) disappeared from the main scene. For testing only.
bEnabled = false
fMinDistance = 1500
fMaxRadius = 200
fMinAngularSize = 0.025
bSkipSkinned = true

[DecalCulling]
; Decals in the main scene (e.g. footprints from Dynamic Footprints, blood, dirt) are no longer drawn beyond this
; distance. Only small decals (radius < fMaxRadius).
; Footprints have a radius of ~22. From ~50 on, plaster and stone patches on walls are affected too (visible).
bEnabled = true
fMaxDistance = 1500
fMaxRadius = 32

[MainViewCulling]
; Main scene: do not draw tiny, far objects AT ALL (no shadow, no pre-pass, no main pass).
; 0.002 is about 2 pixels in diameter at 1280x800 internal resolution. OFF BY DEFAULT - objects may pop in.
bEnabled = false
fMinDistance = 3000
fMaxRadius = 100
fMinAngularSize = 0.002
bSkipSkinned = true

[ShadowCascadeCache]
; Redraw the far sun cascade only every iInterval-th frame; in between the previous shadow map (with its matrix)
; is reused. Saves roughly half of the draws of that cascade (CPU and GPU).
; Side effect: shadows of far moving objects (NPCs) lag one frame behind.
; SHELVED (10/2026): even with an identical cascade the reused map flickers (looks like z-fighting) and it only
; saves draws while standing still. Kept for experiments, not in the menu.
; Use together with [ShadowStableCascade]: the cached map is only reused while the far cascade did not change
; (bRequireSameProjection). Without it the game realigns the cascade almost every frame -> flickers with low sun.
; With the cache on, the far cascade collects shadow casters for the whole held area (no tight hull).
; TEST FEATURE, OFF BY DEFAULT.
bEnabled = false
iCascade = 1
iInterval = 2
; Diagnostic switches (can be toggled live to narrow down image errors).
; bFreezeMatrix = freeze matrix, bFreezeCamera = freeze camera, bFreezeSplits = freeze cascade splits:
bFreezeMatrix = true
bFreezeCamera = true
bFreezeSplits = true
bNoClear = true
bRestoreShadowmap = true
bRestoreVolumetric = true
bSkipDraws = true
; Only cache when the engine computes exactly the same projection for the far cascade as in the last drawn frame
bRequireSameProjection = true
fProjectionEpsilon = 0.0001

[ShadowStableCascade]
; "Calmer far shadows": keeps the far sun shadow cascade still instead of realigning it every frame (the game
; follows the sun, the view direction and the objects with it). It is only realigned when the sun moved by
; fMaxAngleDeg or the view no longer fits into the held area - far shadows shimmer less when moving.
; No performance gain. TEST FEATURE, OFF BY DEFAULT.
bEnabled = false
fMaxAngleDeg = 0.05
; Size of the held area: (game's area + fMargin) * fExtentFactor, in steps of fExtentStep units. Keep it tight:
; soft shadows (Community Shaders) are measured relative to area and depth range - any enlargement makes short
; shadows (roof overhangs) paler. The area is only held against the game's tiny jitter while standing still.
fExtentStep = 64
fExtentFactor = 1.0
fMargin = 48
; Depth: room of fDepthStep units on each side of the game's range
fDepthStep = 64

[ShadowInstancing]
; Identical simple meshes (fences, facades, barrels, rocks ...) are drawn in the sun shadow map with ONE draw call
; per batch (own vertex shader). Only static, opaque, one-sided meshes. Anniversary Edition only.
; Small gain (~0.1 ms in the market test) and the only feature that draws by itself - OFF BY DEFAULT since 1.0.6
; (flickering was reported on some setups). Can be switched on in the menu.
bEnabled = false
; Verify mode: the engine still draws everything, the instances are drawn additionally.
; Together with fDebugOffsetZ (e.g. 300) the instance shadows appear offset -> proof that they arrive.
bVerify = false
fDebugOffsetZ = 0
; Allowed utility shader techniques (hex, comma separated). The log lists the techniques with savings under [Instancing-v2].
sTechnique = C046,C045
; Also instance two-sided meshes (own rasterizer state without culling)
bAllowTwoSided = false
iMinGroup = 2
; Diagnostics: 0 = normal, 1 = redraw without draw calls, 2 = no redraw, 3 = collect only
iDebugMode = 0

[ActorShadowCulling]
; Characters and creatures (body, clothing, hair) no longer cast shadows beyond this distance to the camera.
; Not applied with low sun (see [ShadowCulling] fMinSunElevation). 3500 ~ 50 m. Minimum 2100 ~ 30 m (lower values are raised).
bEnabled = true
fMinDistance = 3500
; also shadows from torches and fires (point lights)
bPointLights = true

[LightGatherThrottle]
; For every dynamic point light (torches, flickering lights) the engine searches EVERY frame which objects it lights
; (~10 % of main thread time in the Whiterun market). If the light has barely moved, the previous list is kept.
bEnabled = true
; search again when the light moved this far (game units; flickering only moves a few units)
fMinMove = 8
; ... or its radius changed this much
fMinRadiusChange = 16
; ... or the last search is this old (ms) - so that characters walking past get lit
fMaxAgeMs = 500

[SubtreePruning]
; Per pass: bSun (sun/moon), bPrecipitation (rain/skylighting). Never for torch shadows (fire bowl shadows went missing).
bSun = true
bPrecipitation = true
; In the shadow and skylighting passes, skip whole groups (node and its contents) when the group as a whole is
; already small and far enough to be culled. Same result, but the engine does not have to visit every part.
bEnabled = true

[TextureStream]
; Shrink textures of far objects (also behind the camera) in VRAM, reload them in the background when you come closer.
; Files on disk are never changed.
bEnabled = true
; Remember the size each texture needed last time (also across sessions, SKSE\SPS_TextureSizes.txt) and use it
; directly the next time it loads -> lower VRAM peak and less reading when entering areas
bLoadReduced = true
; Budget mode: only shrink when video memory gets tight (usage >= fBudgetStartPct % of the budget Windows
; grants the game). With enough VRAM, streaming does nothing and costs nothing.
; bBudgetMode = false: always shrink by distance.
bBudgetMode = true
fBudgetStartPct = 85
; Budget mode: refill VRAM - when usage is fRefillGapPct percentage points below the threshold, downscaled
; textures are gradually reloaded at full size (most needed first)
bRefill = true
fRefillGapPct = 10
; RAM buffer (MB) for reloaded texture data: textures that switch often come from RAM next time instead of
; from disk (least recently used are dropped first). 0 = off
fRamCacheMB = 1024
; Detailed 10-second report in the log (otherwise one summary per minute)
bAnalysis = false
; needed resolution = size on screen x factor
fSafetyFactor = 2.0
; never shrink below this edge length (pixels)
fMinEdge = 1024
; Upper limit for all streamed textures (near ones too), independent of VRAM usage: 1024, 2048, 4096, 8192 or 0 = none.
fMaxEdge = 0
; time per frame for scanning the scene (ms)
fBudgetMs = 0.4
; also shrink clothing and armor of far characters (distance measured at the character itself)
bStreamClothing = true
; TEST: also shrink bodies, faces and hair (textures\actors\character\) of far characters
bStreamCharacters = false
; path parts that are never shrunk (comma separated, lower case; actors\character\ is controlled by bStreamCharacters)
sExclude = interface\,\maps\,mapmarker,\lod\,terrain\,fonts\,book,\sky\,effects\,cubemaps\
