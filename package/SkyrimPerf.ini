; SkyrimPerf - Einstellungen
; Aenderungen werden auch waehrend des Spiels uebernommen (nach ca. 2 Sekunden, siehe SkyrimPerf.log).

[ShadowCulling]
; Kleine, weit entfernte Objekte werfen keinen Sonnenschatten mehr (spart Draw Calls).
; Ein Objekt wird nur verworfen, wenn ALLE Bedingungen zutreffen.
bEnabled = true

; Erst ab dieser Schattenkaskade cullen (0 = naechste Kaskade, 1 = ab der zweiten).
iMinCascade = 1

; Mindestabstand zur Kamera in Spieleinheiten (~70 Einheiten = 1 m). Naeher -> immer Schatten.
fMinDistance = 1500

; Objekte mit groesserem Radius (Gebaeude, Mauern, Felsen) werfen immer Schatten.
fMaxRadius = 250

; Radius geteilt durch Entfernung: darunter wirkt das Objekt so klein, dass sein Schatten wegfaellt.
; 0.035 = z. B. ein Fass (Radius ~40) ab ~1500 Einheiten, ein Strauch (Radius ~80) ab ~2300, ein Karren (Radius ~200) ab ~5700.
; Im Test (Weissstadt-Markt) optisch kein Unterschied zu 0.02, aber ~30% weniger Meshes in Kaskade 1.
; Groesser = mehr Culling, kleiner = weniger Culling.
fMinAngularSize = 0.035

; Charaktere und Kreaturen (geskinnte Meshes) nie cullen.
bSkipSkinned = true
