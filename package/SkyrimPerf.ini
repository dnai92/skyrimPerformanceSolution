; SkyrimPerf - Einstellungen
; Aenderungen werden auch waehrend des Spiels uebernommen (nach ca. 2 Sekunden, siehe SkyrimPerf.log).

[General]
; Taste zum An-/Ausschalten ALLER Culling-Funktionen im Spiel (DirectInput-Scancode, dezimal).
; 199 = Pos1 (Home), 207 = Ende, 201 = Bild auf, 209 = Bild ab, 210 = Einfg. Beim Umschalten erscheint oben links eine Meldung.
iToggleKey = 201
; Diagnose-Auswertungen im Log (Instancing-Analyse, Listen verworfener Objekte, Decal-Tabelle). Kosten Hauptthread-Zeit.
; Nur zum Messen einschalten.
bAnalysis = false

[ShadowCulling]
; Kleine, weit entfernte Objekte werfen keinen Sonnenschatten mehr (spart Draw Calls).
; Ein Objekt wird nur verworfen, wenn ALLE Bedingungen zutreffen.
; Ab 0.7.6 abhaengig vom Sonnenstand: statt des Radius zaehlt die ungefaehre Schattenlaenge (Radius / sin(Sonnenhoehe)).
; Bei tiefer Abend-/Morgensonne werden dadurch deutlich weniger Schatten verworfen (sonst Lichtfehler in der Ferne).
bEnabled = true

; Steht die Sonne tiefer als dieser Winkel (Grad), werden gar keine Sonnenschatten verworfen: bei Morgen-/Abendsonne
; fallen auch fehlende Schatten kleiner Objekte auf, und die Ersparnis ist dann ohnehin gering. 0 = immer cullen.
fMinSunElevation = 25

; Erst ab dieser Schattenkaskade cullen (0 = naechste Kaskade, 1 = ab der zweiten).
iMinCascade = 1

; Mindestabstand zur Kamera in Spieleinheiten (~70 Einheiten = 1 m). Naeher -> immer Schatten.
fMinDistance = 1500

; Objekte mit groesserem Radius (Gebaeude, Mauern, Felsen) werfen immer Schatten.
; 150 (~2 m): bei 250 verschwand der Schatten von Torbauteilen/Bruecke/Tuermen in 70-150 m Entfernung.
fMaxRadius = 150

; Radius geteilt durch Entfernung: darunter wirkt das Objekt so klein, dass sein Schatten wegfaellt.
; 0.035 = z. B. ein Fass (Radius ~40) ab ~1500 Einheiten, ein Strauch (Radius ~80) ab ~2300, ein Karren (Radius ~200) ab ~5700.
; Im Test (Weisslauf-Markt) optisch kein Unterschied zu 0.02, aber ~30% weniger Meshes in Kaskade 1.
; Groesser = mehr Culling, kleiner = weniger Culling.
fMinAngularSize = 0.035

; Charaktere und Kreaturen (geskinnte Meshes) nie cullen.
bSkipSkinned = true

[PointLightShadowCulling]
; Wie [ShadowCulling], aber fuer Schatten von Fackeln, Laternen usw. (Punkt- und Spotlichter).
bEnabled = true
fMinDistance = 1000
fMaxRadius = 150
fMinAngularSize = 0.035
bSkipSkinned = true
; Auch in Innenraeumen? Die werden fast nur von Punktlichtern beleuchtet, fehlende Schatten fallen dort auf.
bInteriors = false

[SkylightingCulling]
; Community Shaders Skylighting: grobe Verdeckungskarte von oben (512x512). CS nimmt Objekte ab Radius 32 auf.
; Kleinere Objekte als fMinRadius werden zusaetzlich weggelassen.
bEnabled = true
fMinRadius = 128

[DepthPrepassCulling]
; Tiefenvorpass der Hauptszene: kleine, weit entfernte Objekte werden dort NICHT vorab in den Tiefenpuffer gezeichnet
; (der Hauptpass zeichnet sie weiterhin normal). Nebenwirkung: solche Objekte bekommen den Sonnenschatten-Wert
; des Hintergrunds (Shadowmask).
; STANDARD AUS: Im Test (0.7.4, Weisslauf) verschwanden dadurch ganze Objekte (nicht nur kleine) aus der
; Hauptszene. Nur zu Testzwecken einschalten.
bEnabled = false
fMinDistance = 1500
fMaxRadius = 200
fMinAngularSize = 0.025
bSkipSkinned = true

[DecalCulling]
; Decals in der Hauptszene (Fussabdruecke z. B. von Dynamic Footprints, Blut, Schmutz) werden ab dieser
; Entfernung nicht mehr gezeichnet. Nur kleine Decals (Radius < fMaxRadius).
; Fussabdruecke haben Radius ~22. Ab ~50 sind auch Putz-/Steinflecken an Mauern betroffen (sichtbar).
bEnabled = true
fMaxDistance = 1500
fMaxRadius = 32

[MainViewCulling]
; Hauptszene: winzige, weit entfernte Objekte GAR NICHT zeichnen (kein Schatten, kein Vorpass, kein Hauptpass).
; 0.002 entspricht bei 1280x800 intern etwa 2 Pixeln Durchmesser. Standardmaessig AUS - Objekte koennten aufploppen.
bEnabled = false
fMinDistance = 3000
fMaxRadius = 100
fMinAngularSize = 0.002
bSkipSkinned = true

[ShadowCascadeCache]
; Ferne Sonnenkaskade nur jeden iInterval-ten Frame neu zeichnen; dazwischen wird die alte Schattenkarte
; (samt passender Matrix) weiterverwendet. Spart grob die Haelfte der Draws dieser Kaskade (CPU und GPU).
; Nebenwirkung: Schatten weit entfernter bewegter Objekte (NPCs) laufen um 1 Frame hinterher.
; STANDARD AUS (0.9.8): flackert bei tiefer Sonne in der fernen Kaskade. Ursache vermutlich: die Engine passt
; Tiefenbereich/Projektion der Kaskade jeden Frame an die Objekte an - bei leerer Kaskade passt das nicht zum Cache.
bEnabled = false
iCascade = 1
iInterval = 2
; Diagnose-Schalter (live umschaltbar, um Bildfehler einzugrenzen). bFreezeMatrix = Matrix, bFreezeCamera = Kamera, bFreezeSplits = Kaskaden-Grenzen einfrieren:
bFreezeMatrix = true
bFreezeCamera = true
bFreezeSplits = true
bNoClear = true
bRestoreShadowmap = true
bRestoreVolumetric = true
bSkipDraws = true
; Nur cachen, wenn die Engine fuer die ferne Kaskade exakt dieselbe Projektion berechnet wie im letzten gezeichneten Frame
bRequireSameProjection = true
fProjectionEpsilon = 0.0001

[ShadowInstancing]
; Gleiche einfache Meshes (Zaeune, Fassaden, Fasser, Felsen ...) werden in der Sonnen-Schattenkarte pro Batch mit
; EINEM Draw Call gezeichnet (eigener Vertex-Shader). Nur statische, undurchsichtige, einseitige Meshes.
; Funktioniert ohne Bildfehler; im Markt-Test ~0,1 ms Ersparnis (einfache Draws sind billig), in anderen Szenen evtl. mehr
bEnabled = true
; Pruefmodus: die Engine zeichnet weiterhin alles, die Instanzen werden zusaetzlich gezeichnet.
; Zusammen mit fDebugOffsetZ (z. B. 300) sieht man die Instanz-Schatten versetzt -> Beweis, dass sie ankommen.
bVerify = false
fDebugOffsetZ = 0
; Erlaubte Utility-Techniken (hex, kommagetrennt). Das Log zeigt unter [Instancing-v2] die Techniken mit Ersparnis.
sTechnique = C046,C045
; Zweiseitige Meshes mit instanzieren (eigener Rasterizer-Zustand ohne Culling)
bAllowTwoSided = false
iMinGroup = 2
; Diagnose: 0 normal, 1 = Nachzeichnen ohne Draw-Aufrufe, 2 = kein Nachzeichnen, 3 = nur sammeln
iDebugMode = 0

[ActorShadowCulling]
; Charaktere/Kreaturen (Koerper, Kleidung, Haare) werfen ab dieser Entfernung zur Kamera keinen Schatten mehr.
; Gilt nicht bei tiefer Sonne (siehe [ShadowCulling] fMinSunElevation). 3500 ~ 50 m. Minimum 2100 ~ 30 m (kleinere Werte werden angehoben).
bEnabled = true
fMinDistance = 3500
; auch Schatten durch Fackeln/Feuer (Punktlichter)
bPointLights = true

[LightGatherThrottle]
; Die Engine sucht fuer jedes dynamische Punktlicht (Fackeln, flackernde Lichter) in JEDEM Frame neu, welche Objekte
; es beleuchtet (am Weisslauf-Markt ~10 % der Hauptthread-Zeit). Hat sich das Licht kaum bewegt, bleibt die alte Liste.
bEnabled = true
; neu suchen, wenn sich das Licht so weit bewegt hat (Spielereinheiten; Flackern bewegt nur wenige Einheiten)
fMinMove = 8
; ... oder sich sein Radius so stark geaendert hat
fMinRadiusChange = 16
; ... oder die letzte Suche so lange her ist (ms) - damit vorbeilaufende Figuren Licht bekommen
fMaxAgeMs = 500

[SubtreePruning]
; einzeln je Durchlauf: bSun (Sonne/Mond), bPrecipitation (Regen/Skylighting)
; Punktlicht-/Fackelschatten nie (ab 0.17.5 fest aus): Schatten von Feuerschalen fehlten, Nutzen nur 1-3 Knoten/Frame
bSun = true
bPrecipitation = true
; Im Schatten- und Skylighting-Durchlauf ganze Gruppen (Knoten samt Inhalt) ueberspringen, wenn schon die Gruppe
; als Ganzes klein und weit genug fuer das Culling ist. Ergebnis gleich, aber die Engine muss die Teile nicht einzeln besuchen.
bEnabled = true

[TextureStream]
; Texturen ferner Objekte (auch hinter der Kamera) im VRAM verkleinern, bei Annaeherung im Hintergrund neu laden.
; Die Dateien auf der Platte werden nie veraendert.
bEnabled = true
; Zuletzt benoetigte Groesse je Textur merken (auch ueber Sitzungen, SKSE\SkyrimPerf_TextureSizes.txt) und
; beim naechsten Laden gleich verwenden -> weniger VRAM-Spitze und Lesen beim Betreten von Gebieten
bLoadReduced = true
; Budget-Modus: nur verkleinern, wenn der Grafikspeicher knapp wird (Belegung >= fBudgetStartPct % des Budgets,
; das Windows dem Spiel zuteilt). Mit genug VRAM tut das Streaming dann nichts und kostet nichts.
; bBudgetMode = false: immer nach Entfernung verkleinern.
bBudgetMode = true
fBudgetStartPct = 85
; Budget-Modus: VRAM wieder auffuellen - liegt die Belegung fRefillGapPct %-Punkte unter der Schwelle, werden
; verkleinerte Texturen nach und nach wieder voll geladen (die meistgebrauchten zuerst)
bRefill = true
fRefillGapPct = 10
; RAM-Puffer (MB) fuer neu geladene Texturdaten: Texturen, die oefter wechseln, kommen beim naechsten Mal aus dem RAM
; statt von der Platte (am laengsten nicht gebrauchte fliegen zuerst raus). 0 = aus
fRamCacheMB = 1024
; Ausfuehrlicher 10-s-Bericht im Log (sonst nur eine Zusammenfassung pro Minute)
bAnalysis = false
; benoetigte Aufloesung = Groesse auf dem Bildschirm x Faktor
fSafetyFactor = 2.0
; nie unter diese Kantenlaenge verkleinern
fMinEdge = 1024
; Zeit pro Frame fuer den Durchlauf durch die Szene (ms)
fBudgetMs = 0.4
; Pfadteile, die nie verkleinert werden (kommagetrennt, Kleinschreibung)
sExclude = interface\,\maps\,mapmarker,\lod\,terrain\,fonts\,book,\sky\,effects\,cubemaps\
